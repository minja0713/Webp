<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>라면을 끓이는 순서</title>
</head>

<body>
    <h3>라면을 끓이는 순서</h3>
    <hr>
    <ol type="A" style="background-color:yellowgreen" onclick="progress(this)">
        <li>물을 끓인다.</li>
    </ol>
    <script>
        function progress(obj) {
            let input = prompt("라면을 끓이는 순서를 입력하라.");
            if (input != null && input != "") {
                let li = document.createElement("li");
                li.innerHTML = input;
                obj.appendChild(li);
            }
        }
    </script>
</body>
</html>
