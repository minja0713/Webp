<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>transform:rotate()</title>
    <script>
        let scale = 1;

        function enLargeImage(obj) {
            scale++;
            obj.style.transform = `scale(${scale},1)`;
        }
    </script>
</head>

<body>
    <h3>클릭하면 2,3,4배로 옆으로 늘어납니다.</h3>
    <hr>
    <img src="spongebob.png" width="150" height="150" onclick="enLargeImage(this)">
</body>
</html>
