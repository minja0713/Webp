<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <<title>document.write()로 표 만들기</title>
</head>

<body>
    <h3>document.write()로 표 만들기</h3>
    <hr>
    <script>
        document.write("<table border='1'>");

        document.write("<tr><td>n</td>");
        for (let n = 0; n <= 9; n++) {
            document.write("<td>" + n + "</td>");
        }
        document.write("</tr>");

        document.write("<tr><td>n<sup>2</sup></td>");
        for (let n = 0; n <= 9; n++) {
            document.write("<td>" + n * n + "</td>");
        }
        document.write("</tr>");

        document.write("</table>");
    </script>
</body>

</html>
