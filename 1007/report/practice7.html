<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>큰 자리수와 낮은자리수 같은지 비교</title>
</head>

<body>
    <h3>큰 자리수와 낮은자리수 같은지 비교</h3>
    <hr>
    <script>
        let n = parseInt(prompt("숫자 입력"));
        let input = n;

        let low = n % 10;

        while (n >= 10) {
            n = Math.floor(n / 10);
        }
        let high = n;

        if (high === low)
            document.write(input + ": 같음");
        else
            document.write(input + ": 다름");
    </script>
</body>

</html>
