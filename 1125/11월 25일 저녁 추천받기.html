<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>11월 25일 저녁 신청 받기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      color: #202124;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 32px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 25px;
      line-height: 1.4;
      text-align: center;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd0d6;
      border-radius: 6px;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid #9bbcf5;
      border-color: #4285f4;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 6px;
      background: #1a73e8;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      background: #9aa0a6;
      cursor: wait;
    }

    .error {
      margin-top: 14px;
      color: #b3261e;
      font-size: 14px;
      text-align: center;
    }

    .thanks {
      padding: 28px 0;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>11월 25일 저녁 신청 받기</h1>

    <form id="applicationForm">
      <label for="name">이름</label>
      <input id="name" name="name" type="text" maxlength="100" required>

      <label for="food">음식</label>
      <input id="food" name="food" type="text" maxlength="200" required>

      <label for="message">하고싶은 말</label>
      <textarea id="message" name="message" maxlength="1000" required></textarea>

      <button id="submitButton" type="submit">확인</button>
      <p id="errorMessage" class="error" role="alert" hidden></p>
    </form>

    <div id="thanksMessage" class="thanks" hidden>
      답장 감사합니다
    </div>
  </main>

  <script>
    const form = document.getElementById('applicationForm');
    const submitButton = document.getElementById('submitButton');
    const errorMessage = document.getElementById('errorMessage');
    const thanksMessage = document.getElementById('thanksMessage');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      errorMessage.hidden = true;
      submitButton.disabled = true;
      submitButton.textContent = '전송 중...';

      const data = {
        name: document.getElementById('name').value,
        food: document.getElementById('food').value,
        message: document.getElementById('message').value
      };

      google.script.run
        .withSuccessHandler(function () {
          form.hidden = true;
          thanksMessage.hidden = false;
        })
        .withFailureHandler(function (error) {
          errorMessage.textContent = error.message || '저장 중 오류가 발생했습니다.';
          errorMessage.hidden = false;
          submitButton.disabled = false;
          submitButton.textContent = '확인';
        })
        .submitForm(data);
    });
  </script>
</body>
</html>
