<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방문 요일에 따라 변하는</title>
</head>
<body>
    <h3>일요일은 pink, 다른 요일은 gold 배경</h3>
    <hr>
    <script>
        let time = new Date();
        let week = ['일', '월', '회', '수', '목', '금', '토'];
        let day = week[time.getDay()];
        document.write("오늘 : ");
        document.write(time.getDate() + "일" + ", ");
        document.write(day + "요일");
        
        if (time.getDay() == 0) {
            document.body.style.backgroundColor = "pink";
        } else {
            document.body.style.backgroundColor = "gold";
        }
    </script>
</body>
</html>
