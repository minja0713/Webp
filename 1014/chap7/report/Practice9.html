<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>book 객체 만들기</title>
</head>
<body>
    <h3>book 객체 만들기</h3>
    <hr>
    <script>
        //(1)
        let book1 = new Object();
        book1.title = "HTML5";
        book1.name = "황기태";
        book1.price = 20000;
        document.write("book : " + book1.title + ", " + book1.name + ", " + book1.price);
        document.write("<hr>");

        //(2)
        let book2 = {
            title:"HTML5",
            name: "황기태",
            price: 20000
        }
        document.write("book : " + book2.title + ", " + book2.name + ", " + book2.price);
        document.write("<hr>");

        //(3)
        function book3(title, name, price){
            this.title = title;
            this.name = name;
            this.price = price;
        }
        let book = new book3("HTML5", "황기태", 20000);
        document.write("book : " + book.title + ", " + book.name + ", " + book.price);
    </script>
</body>
</html>
