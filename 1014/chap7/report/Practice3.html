<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방문 시간이 오전 오후에 따라서 색이 달라지는</title>
</head>
<body>
    <h3>오전이면 lightskyblue, 오후이면 orange 배경</h3>
    <hr>
    <script>
        let time = new Date();
        document.write("현재 시간 : ");
        document.write(time.getHours() + "시" + ", ");
        document.write(time.getMinutes() + "분" + ", ");
        document.write(time.getSeconds() + "초" + ", ");

        if(time.getHours() > 12) document.body.style.backgroundColor = "orange";
        else document.body.style.backgroundColor = "lightskyblue";
    </script>
</body>
</html>
