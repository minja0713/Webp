<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math.random()으로 랜덤한 색 만들기</title>
    <link rel="stylesheet" href="Practice_8.css">
</head>
<body>
    <h3>16개의 랜덤한 색 만들기</h3>
    <hr>

    <div id="1"></div>
    <div id="2"></div>
    <div id="3"></div>
    <div id="4"></div>
    <div id="5"></div>
    <div id="6"></div>
    <div id="7"></div>
    <div id="8"></div>
    <div id="9"></div>
    <div id="10"></div>
    <div id="11"></div>
    <div id="12"></div>
    <div id="13"></div>
    <div id="14"></div>
    <div id="15"></div>
    <div id="16"></div>
    <div id="17"></div>

    <script>
        for(let i=1; i<=17; i++){
            let r = Math.floor(Math.random()*256);
            let g = Math.floor(Math.random()*256);
            let b = Math.floor(Math.random()*256);

            let rgb = "rgb("+r+", "+g+", "+b+")";

            document.getElementById(i).style.backgroundColor = rgb;
            document.getElementById(i).textContent = rgb
        }
        
    </script>
</body>
</html>
